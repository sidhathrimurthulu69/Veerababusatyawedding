<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#fbf6f0">
<title>Wedding Reception — Veerababu & Satya</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    height: 100vh; height: 100dvh;
    overflow: hidden;
    background: #fbf6f0;
    color: #3b2a2e;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  body {
    display: flex; flex-direction: column;
    align-items: center; justify-content: space-between;
    gap: 8px; padding: 10px 12px 12px;
  }
  #cardStage {
    flex: 1 1 auto; min-height: 0;
    width: 100%; max-width: 680px;
    display: flex; align-items: center; justify-content: center;
  }
  #wrap {
    position: relative;
    display: inline-flex; align-items: center; justify-content: center;
    max-width: 100%; max-height: 100%;
    overflow: hidden; border-radius: 18px;
    border: 2px solid #e7d5cc;
    box-shadow: 0 10px 26px rgba(92, 57, 64, 0.14);
    background: #fff; touch-action: none;
  }
  #invite {
    display: block; max-width: 100%; max-height: 100%;
    width: auto; height: auto; object-fit: contain;
    user-select: none; -webkit-user-drag: none;
  }
  #scratch {
    position: absolute; inset: 0; width: 100%; height: 100%;
    touch-action: none; cursor: crosshair;
  }
  #label {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    flex-direction: column; gap: 6px; padding: 12px;
    color: #5d2d3b; font-size: clamp(17px, 4.2vw, 24px); font-weight: 700;
    text-shadow: 0 1px 2px #fffc; pointer-events: none; text-align: center;
  }
  #label small { font-size: clamp(12px, 3vw, 14px); font-weight: 500; }
  #bottomPanel {
    flex: 0 0 auto; width: 100%; max-width: 540px;
    display: flex; flex-direction: column; gap: 7px;
  }
  #venueText {
    margin: 0; text-align: center;
    font-size: clamp(13px, 3.4vw, 15px);
    font-weight: 600; color: #5d2d3b;
  }
  #actions {
    display: grid; grid-template-columns: 1fr 1.35fr; gap: 8px;
  }
  #musicBtn, #locationBtn {
    border: 0; border-radius: 999px; color: #fff;
    font-weight: 700; font-size: clamp(12px, 3.2vw, 14px);
    padding: 10px; cursor: pointer; font-family: inherit;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  #musicBtn { background: #3f6653; box-shadow: 0 3px 0 #294537; }
  #locationBtn { background: #b84b62; box-shadow: 0 3px 0 #823042; }
  #musicBtn:active, #locationBtn:active { transform: translateY(2px); box-shadow: none; }
  #countdown {
    background: #ffffff;
    border: 1px solid #eadad2;
    border-radius: 18px;
    padding: 9px 12px;
    text-align: center;
    box-shadow: 0 6px 18px rgba(92, 57, 64, 0.08);
  }
  #countdown h2 {
    margin: 0 0 7px;
    font-size: clamp(14px, 3.8vw, 18px);
    color: #5d2d3b;
  }
  #timer {
    display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px;
  }
  .time-unit {
    background: #f9eff1;
    border-radius: 12px;
    padding: 6px 4px;
  }
  .time-unit strong {
    display: block; font-size: clamp(18px, 4.6vw, 23px); color: #b84b62;
  }
  .time-unit span {
    font-size: 10px; letter-spacing: 0.6px; text-transform: uppercase; color: #6e5258;
  }
  #status {
    margin: 6px 0 0; font-size: 11px; color: #7a5c62;
  }

  /* Falling hearts overlay */
  #heartsLayer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    overflow: hidden;
    z-index: 9999;
  }
  .falling-heart {
    position: absolute;
    top: -40px;
    user-select: none;
    will-change: transform, opacity;
    animation: heartFall var(--dur, 4.5s) linear forwards;
  }
  @keyframes heartFall {
    0% {
      transform: translate3d(0, 0, 0) rotate(0deg) scale(0.85);
      opacity: 0;
    }
    10% {
      opacity: 0.95;
    }
    50% {
      transform: translate3d(var(--sway, 24px), 52vh, 0) rotate(180deg) scale(1);
    }
    90% {
      opacity: 0.9;
    }
    100% {
      transform: translate3d(calc(var(--sway, 24px) * -0.6), 108vh, 0) rotate(360deg) scale(0.95);
      opacity: 0;
    }
  }
</style>
</head>
<body>

<div id="heartsLayer" aria-hidden="true"></div>

<audio id="bgMusic" loop preload="none">
  <source src="music.mp3" type="audio/mpeg">
</audio>

<div id="cardStage">
  <div id="wrap" aria-label="Scratch to reveal the wedding invitation">
    <img id="invite" src="invitation.jpg" alt="Wedding invitation for Veerababu and Satya">
    <canvas id="scratch"></canvas>
    <div id="label">🌸 SCRATCH TO OPEN 🌸<small>Veerababu & Satya's Reception 💖</small></div>
  </div>
</div>

<div id="bottomPanel">
  <p id="venueText">📍 Venue: Ramayyapalem, Gandepalli</p>
  <div id="actions">
    <button id="musicBtn" type="button">🎵 Play Music</button>
    <button id="locationBtn" type="button">📍 View Venue on Google Maps</button>
  </div>
  <div id="countdown">
    <h2>Wedding Reception Starts In 💕</h2>
    <div id="timer" aria-live="polite">
      <div class="time-unit"><strong id="days">00</strong><span>Days</span></div>
      <div class="time-unit"><strong id="hours">00</strong><span>Hours</span></div>
      <div class="time-unit"><strong id="minutes">00</strong><span>Minutes</span></div>
      <div class="time-unit"><strong id="seconds">00</strong><span>Seconds</span></div>
    </div>
    <p id="status">🎉 Welcome! We are waiting to celebrate with you.</p>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
<script>
(() => {
  document.getElementById('locationBtn').addEventListener('click', () => {
    window.open('https://maps.app.goo.gl/GQjV3VUy5Ukgzd6u5?g_st=ac', '_blank', 'noopener');
  });

  const music = document.getElementById('bgMusic');
  const musicBtn = document.getElementById('musicBtn');
  musicBtn.addEventListener('click', async () => {
    try {
      if (music.paused) {
        await music.play();
        musicBtn.textContent = '⏸️ Pause Music';
      } else {
        music.pause();
        musicBtn.textContent = '🎵 Play Music';
      }
    } catch (e) {
      musicBtn.textContent = '⚠️ Add music.mp3';
    }
  });

  // Falling hearts animation triggered on invitation reveal
  const heartsLayer = document.getElementById('heartsLayer');
  const heartSymbols = ['💖', '💕', '💗', '❤️', '🩷', '🌸'];
  let heartsStarted = false;

  function spawnHeart() {
    const heart = document.createElement('span');
    heart.className = 'falling-heart';
    heart.textContent = heartSymbols[Math.floor(Math.random() * heartSymbols.length)];
    heart.style.left = (Math.random() * 96 + 2) + 'vw';
    heart.style.fontSize = (15 + Math.random() * 14) + 
    'px';

    const duration = 3.8 + Math.random() * 2.4;
    const sway = (Math.random() > 0.5 ? 1 : -1) * (16 + Math.random() * 28);
    heart.style.setProperty('--dur', duration.toFixed(2) + 's');
    heart.style.setProperty('--sway', sway.toFixed(0) + 'px');

    heartsLayer.appendChild(heart);
    heart.addEventListener('animationend', () => heart.remove());
  }

  function startFallingHearts() {
    if (heartsStarted) return;
    heartsStarted = true;
    // Initial celebratory shower of hearts
    for (let i = 0; i < 28; i++) {
      setTimeout(spawnHeart, i * 65);
    }
    // Gentle continuous falling hearts afterward
    setInterval(spawnHeart, 450);
  }

  const wrap = document.getElementById('wrap');
  const canvas = document.getElementById('scratch');
  const ctx = canvas.getContext('2d', { willReadFrequently: true });
  const label = document.getElementById('label');
  let drawing = false, isRevealed = false, hasScratched = false, lastCheck = 0;

  function drawCoating(force = false) {
    if (isRevealed || (hasScratched && !force)) return;
    const rect = wrap.getBoundingClientRect();
    if (!rect.width || !rect.height) return;
    const dpr = Math.max(1, window.devicePixelRatio || 1);
    canvas.width = Math.round(rect.width * dpr);
    canvas.height = Math.round(rect.height * dpr);
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    const g = ctx.createLinearGradient(0, 0, rect.width, rect.height);
    g.addColorStop(0, '#e8c4cc');
    g.addColorStop(0.5, '#f6e3dc');
    g.addColorStop(1, '#d9aeb8');
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = g;
    ctx.fillRect(0, 0, rect.width, rect.height);
    ctx.globalCompositeOperation = 'destination-out';
  }

  function eraseAt(e) {
    if (isRevealed) return;
    hasScratched = true;
    const rect = canvas.getBoundingClientRect();
    ctx.beginPath();
    ctx.arc(e.clientX - rect.left, e.clientY - rect.top, 25, 0, Math.PI * 2);
    ctx.fill();
    if (Date.now() - lastCheck > 180) {
      lastCheck = Date.now();
      const px = ctx.getImageData(0, 0, canvas.width, canvas.height).data;
      let cleared = 0, sampled = 0;
      for (let i = 0; i < canvas.width * canvas.height; i += 16) {
        sampled++;
        if (px[i * 4 + 3] < 80) cleared++;
      }
      if (sampled && (cleared / sampled) * 100 >= 50) {
        isRevealed = true;
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        canvas.style.pointerEvents = 'none';
        label.style.display = 'none';
        if (typeof confetti === 'function') confetti({ particleCount: 100, spread: 75, origin: { y: 0.55 } });
        startFallingHearts();
      }
    }
  }

  canvas.addEventListener('pointerdown', e => { if (!isRevealed) { drawing = true; canvas.setPointerCapture(e.pointerId); eraseAt(e); } });
  canvas.addEventListener('pointermove', e => { if (drawing) eraseAt(e); });
  ['pointerup', 'pointercancel', 'lostpointercapture'].forEach(ev => canvas.addEventListener(ev, () => { drawing = false; }));

  const invite = document.getElementById('invite');
  invite.addEventListener('load', () => drawCoating(true));
  if (invite.complete && invite.naturalWidth) drawCoating(true);
  if (typeof ResizeObserver === 'function') new ResizeObserver(() => drawCoating(false)).observe(wrap);
  window.addEventListener('resize', () => drawCoating(false));

  const target = new Date('2026-12-13T19:00:00+05:30').getTime();
  function tick() {
    const diff = target - Date.now();
    if (diff <= 0) {
      ['days','hours','minutes','seconds'].forEach(id => document.getElementById(id).textContent = '00');
      document.getElementById('status').textContent = '🎉 The celebration has started!';
      return;
    }
    document.getElementById('days').textContent = String(Math.floor(diff / 86400000)).padStart(2, '0');
    document.getElementById('hours').textContent = String(Math.floor((diff % 86400000) / 3600000)).padStart(2, '0');
    document.getElementById('minutes').textContent = String(Math.floor((diff % 3600000) / 60000)).padStart(2, '0');
    document.getElementById('seconds').textContent = String(Math.floor((diff % 60000) / 1000)).padStart(2, '0');
  }
  tick(); setInterval(tick, 1000);
})();
</script>
</body>
</html>
